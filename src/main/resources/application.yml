spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/product_service?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false #${MYSQL_URL}
    username: root #${MYSQL_USERNAME}
    password: 1234 #${MYSQL_PASSWORD}
